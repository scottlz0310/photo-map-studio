name: Prepare Release

# リリース準備 PR を起票する（手動起動）。
# CHANGELOG の [Unreleased] を指定の版で確定し、GitHub App 名義の PR（件名 `chore(release): vX.Y.Z`）を作る。
# この PR をレビューしてマージすると、publish-release.yml が成果物の作成・検証・公開を行う。
#
# 版数はリポジトリのファイルを更新しない（bump_strategy: none）。
# MSIX の版は、従来どおりタグからビルド時に Package.appxmanifest へ注入する（publish-release.yml）。

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'リリースする版（例: 0.3.0）'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # アプリのリリース準備のたびに、NuGet パッケージ（PhotoMapStudio.Tiles・PhotoMapStudio.Rendering）の未公開の変更を知らせる
  # （警告のみ。リリース準備は止めない）。パッケージの公開は、パッケージごとのタグ（tiles-vX.Y.Z・rendering-vX.Y.Z）で別に行う
  # （docs/development/releasing-tiles.md・releasing-rendering.md）。
  package-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package-id: PhotoMapStudio.Tiles
            package-path: src/PhotoMapStudio.Tiles
            tag-prefix: tiles-v
            release-guide: docs/development/releasing-tiles.md
          - package-id: PhotoMapStudio.Rendering
            package-path: src/PhotoMapStudio.Rendering
            tag-prefix: rendering-v
            release-guide: docs/development/releasing-rendering.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 最新の <tag-prefix>* タグからの差分を調べるため、履歴とタグが要る
          fetch-depth: 0

      - name: Check unpublished ${{ matrix.package-id }} changes
        shell: pwsh
        run: >
          ./scripts/Test-PackageUnpublishedChanges.ps1
          -PackageId ${{ matrix.package-id }}
          -PackagePath ${{ matrix.package-path }}
          -TagPrefix ${{ matrix.tag-prefix }}
          -ReleaseGuide ${{ matrix.release-guide }}

  prepare:
    uses: scottlz0310/release-automate/.github/workflows/reusable-prepare-release.yml@b155081b04cae981e8ae3beeb37aa1c024866ea2 # v3.3.0
    secrets: inherit
    with:
      target_version: ${{ inputs.target_version }}
      bump_strategy: none
