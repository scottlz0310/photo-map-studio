name: tmp env probe

# 一時的な検証用（この PR の中で削除する）。GITHUB_TOKEN で環境 API を読み取れる権限を調べる（読み取りのみ）。
on:
  pull_request:
    paths: ['.github/workflows/tmp-env-probe.yml']

permissions:
  contents: read

jobs:
  contents-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: list environments (contents:read only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/environments" --jq '{total_count, names: [.environments[].name]}'

  actions-read:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: list environments (actions:read)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/environments" --jq '{total_count, names: [.environments[].name]}'

  deployments-read:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    steps:
      - name: list environments (deployments:read)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/environments" --jq '{total_count, names: [.environments[].name]}'
